packages:
  - .
resolver: nightly-2026-11-22
# Nightly still uses GHC 9.12; test the latest released GHC.
compiler: ghc-9.14.1
compiler-check: match-exact
extra-deps:
  - crypton-2.3.0
  - crypton-x509-1.11.0
  - crypton-x509-store-1.10.2
  - crypton-x509-system-1.10.2
  - crypton-x509-validation-1.11.0
  - hpke-0.4.0
  - tls-2.6.2
allow-newer: true
allow-newer-deps:
  # These snapshot packages have not widened their GHC 9.14 boot-package bounds.
  - cborg
  - serialise
